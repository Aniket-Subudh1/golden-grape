# /etc/nginx/conf.d/goldengrape.conf
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name goldengrape.devsomeware.com;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/goldengrape.devsomeware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldengrape.devsomeware.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build files: served from disk, never touching Node, cached for a year.
    location /_next/static/ {
        alias /opt/golden-grape/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Overwritten, not appended: rate limits read the first hop, which a visitor must not control.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages stream their CMS regions behind Suspense.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name goldengrape.devsomeware.com;
    return 301 https://$host$request_uri;
}
